<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seat Map Download Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h3><i class="fas fa-image"></i> Seat Map Download Test</h3>
            </div>
            <div class="card-body">
                <p class="mb-4">This page tests the seat map download functionality.</p>
                
                <div class="row">
                    <div class="col-md-6">
                        <h5>Available Arrangements:</h5>
                        <div id="arrangementsList" class="list-group"></div>
                    </div>
                    
                    <div class="col-md-6">
                        <h5>Seat Map Preview:</h5>
                        <img id="seatMapPreview" src="" alt="Seat Map" class="img-fluid" style="border: 1px solid #ddd; padding: 10px; display: none;">
                        <p id="noMapMsg" class="text-muted">Select an arrangement to view</p>
                    </div>
                </div>
                
                <hr>
                
                <div>
                    <h5>Download Options:</h5>
                    <button class="btn btn-info me-2" id="downloadImageBtn" disabled>
                        <i class="fas fa-image"></i> Download Seat Map Image
                    </button>
                    <button class="btn btn-primary" id="viewImageBtn" disabled>
                        <i class="fas fa-eye"></i> View in New Tab
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8000/api';
        let currentArrangementId = null;

        // Load arrangements
        async function loadArrangements() {
            try {
                const response = await fetch(`${API_BASE_URL}/seating/arrangements`);
                const data = await response.json();
                const arrangements = data.arrangements || [];
                
                const list = document.getElementById('arrangementsList');
                list.innerHTML = '';
                
                arrangements.forEach(arr => {
                    const item = document.createElement('button');
                    item.className = 'list-group-item list-group-item-action text-start';
                    item.innerHTML = `
                        <strong>${arr.id}</strong><br>
                        <small class="text-muted">Date: ${arr.exam_date}</small>
                    `;
                    item.onclick = () => selectArrangement(arr.id);
                    list.appendChild(item);
                });
            } catch (error) {
                console.error('Error loading arrangements:', error);
            }
        }

        // Select arrangement
        function selectArrangement(arrangementId) {
            currentArrangementId = arrangementId;
            
            // Update buttons
            document.getElementById('downloadImageBtn').disabled = false;
            document.getElementById('viewImageBtn').disabled = false;
            
            // Load preview
            const previewImg = document.getElementById('seatMapPreview');
            const noMapMsg = document.getElementById('noMapMsg');
            previewImg.src = `${API_BASE_URL}/seating/arrangement/${arrangementId}/seat-map`;
            previewImg.style.display = 'block';
            noMapMsg.style.display = 'none';
        }

        // Download image
        async function downloadSeatMapImage() {
            if (!currentArrangementId) return;
            
            try {
                const url = `${API_BASE_URL}/seating/arrangement/${currentArrangementId}/seat-map`;
                const response = await fetch(url);
                const blob = await response.blob();
                
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `seat-map-${currentArrangementId}.png`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(link.href);
                
                alert('Seat map downloaded successfully!');
            } catch (error) {
                console.error('Download error:', error);
                alert('Failed to download seat map');
            }
        }

        // View image in new tab
        function viewImageInNewTab() {
            if (!currentArrangementId) return;
            const url = `${API_BASE_URL}/seating/arrangement/${currentArrangementId}/seat-map`;
            window.open(url, '_blank');
        }

        // Attach event listeners
        document.getElementById('downloadImageBtn').onclick = downloadSeatMapImage;
        document.getElementById('viewImageBtn').onclick = viewImageInNewTab;

        // Load on page load
        loadArrangements();
    </script>
</body>
</html>
