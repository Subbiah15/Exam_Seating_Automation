<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Seating Engine - Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        
        .signup-container {
            max-width: 500px;
            width: 100%;
        }
        
        .signup-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        
        .signup-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .signup-header h1 {
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 700;
        }
        
        .signup-header p {
            font-size: 14px;
            opacity: 0.9;
            margin: 0;
        }
        
        .signup-body {
            padding: 40px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .form-control {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px 15px;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.15);
        }
        
        .btn-signup {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        
        .btn-signup:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
            color: white;
        }
        
        .btn-signup:active {
            transform: translateY(0);
        }
        
        .error-message {
            color: #dc3545;
            font-size: 13px;
            margin-top: 10px;
            padding: 10px;
            background: #f8d7da;
            border-radius: 6px;
            display: none;
        }
        
        .success-message {
            color: #155724;
            font-size: 13px;
            margin-top: 10px;
            padding: 10px;
            background: #d4edda;
            border-radius: 6px;
            display: none;
        }
        
        .login-link {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        
        .login-link p {
            margin: 0;
            color: #666;
            font-size: 14px;
        }
        
        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        
        .login-link a:hover {
            text-decoration: underline;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 10px;
        }
        
        .spinner-border {
            width: 20px;
            height: 20px;
            margin-right: 10px;
        }
        
        .role-info {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #666;
        }
        
        .form-text {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <div class="signup-card">
            <div class="signup-header">
                <h1>🎓 Create Account</h1>
                <p>Join Exam Seating Engine</p>
            </div>
            
            <div class="signup-body">
                <div class="role-info" id="roleInfo">
                    Signing up as: <strong id="roleDisplay">Admin/Teacher</strong>
                </div>
                
                <form id="signupForm">
                    <input type="hidden" id="role" name="role" value="admin">
                    
                    <div class="form-group">
                        <label class="form-label" for="fullName">Full Name</label>
                        <input type="text" class="form-control" id="fullName" name="name" placeholder="Enter your full name" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="username">Username</label>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username" required>
                        <div class="form-text">Must be 3-20 characters, alphanumeric and underscore only</div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="email">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter a strong password" required>
                        <div class="form-text">Minimum 6 characters</div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="confirmPassword">Confirm Password</label>
                        <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required>
                    </div>
                    
                    <!-- Student ID field (shown only for students) -->
                    <div class="form-group" id="studentIdGroup" style="display: none;">
                        <label class="form-label" for="studentId">Student ID</label>
                        <input type="text" class="form-control" id="studentId" name="student_id" placeholder="Enter your student ID">
                        <div class="form-text">e.g., STU001, A00123</div>
                    </div>
                    
                    <div id="errorMessage" class="error-message"></div>
                    <div id="successMessage" class="success-message"></div>
                    
                    <div class="loading" id="loadingDiv">
                        <div class="spinner-border text-primary" role="status"></div>
                        <span>Creating account...</span>
                    </div>
                    
                    <button type="submit" class="btn-signup" id="signupBtn">Create Account</button>
                </form>
                
                <div class="login-link">
                    <p>Already have an account? <a href="login.html">Login here</a></p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Get role from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const role = urlParams.get('role') || 'admin';
        
        document.getElementById('role').value = role;
        document.getElementById('roleDisplay').textContent = role === 'student' ? 'Student' : 'Admin/Teacher';
        
        // Show student ID field only for students
        if (role === 'student') {
            document.getElementById('studentIdGroup').style.display = 'block';
            document.getElementById('studentId').required = true;
        }
        
        // Handle signup form submission
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fullName = document.getElementById('fullName').value.trim();
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const studentId = document.getElementById('studentId').value.trim();
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            const loadingDiv = document.getElementById('loadingDiv');
            const signupBtn = document.getElementById('signupBtn');
            
            errorDiv.style.display = 'none';
            errorDiv.innerHTML = '';
            successDiv.style.display = 'none';
            successDiv.innerHTML = '';
            
            // Client-side validation
            if (!fullName) {
                errorDiv.innerHTML = '❌ Full name is required';
                errorDiv.style.display = 'block';
                return;
            }
            
            if (username.length < 3 || username.length > 20) {
                errorDiv.innerHTML = '❌ Username must be 3-20 characters';
                errorDiv.style.display = 'block';
                return;
            }
            
            if (!email || !email.includes('@')) {
                errorDiv.innerHTML = '❌ Valid email address is required';
                errorDiv.style.display = 'block';
                return;
            }
            
            if (password.length < 6) {
                errorDiv.innerHTML = '❌ Password must be at least 6 characters';
                errorDiv.style.display = 'block';
                return;
            }
            
            if (password.length > 72) {
                errorDiv.innerHTML = '❌ Password must not exceed 72 characters';
                errorDiv.style.display = 'block';
                return;
            }
            
            if (password !== confirmPassword) {
                errorDiv.innerHTML = '❌ Passwords do not match';
                errorDiv.style.display = 'block';
                return;
            }
            
            if (role === 'student' && !studentId) {
                errorDiv.innerHTML = '❌ Student ID is required';
                errorDiv.style.display = 'block';
                return;
            }
            
            loadingDiv.style.display = 'block';
            signupBtn.disabled = true;
            
            try {
                console.log('Submitting signup form for role:', role);
                
                const payload = {
                    name: fullName,
                    username: username,
                    email: email,
                    password: password,
                    role: role,
                    student_id: role === 'student' ? studentId : null
                };
                
                console.log('Payload:', payload);
                
                const response = await fetch('http://127.0.0.1:8081/api/auth/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload)
                });
                
                console.log('Response status:', response.status);
                
                const data = await response.json();
                console.log('Response data:', data);
                
                if (!response.ok) {
                    throw new Error(data.detail || data.message || 'Signup failed');
                }
                
                successDiv.innerHTML = '✅ Account created successfully! Redirecting to login...';
                successDiv.style.display = 'block';
                
                // Redirect to login page immediately (will happen in 1 second)
                await new Promise(resolve => setTimeout(resolve, 1000));
                window.location.href = 'login.html';
                
            } catch (error) {
                console.error('Signup error:', error);
                errorDiv.innerHTML = '❌ ' + (error.message || 'Signup failed. Please try again.');
                errorDiv.style.display = 'block';
            } finally {
                loadingDiv.style.display = 'none';
                signupBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
